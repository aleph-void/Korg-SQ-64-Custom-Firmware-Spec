[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sq64-spec"
version = "0.6.0"
description = "Independent SQ-64 firmware contracts and conformance reporting"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
sq64-conformance = "sq64_spec.cli:main"
[tool.setuptools.package-data]
sq64_spec = ["*.json"]

[tool.setuptools.packages.find]
include = ["sq64_spec*"]
